<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="260" height="260" viewBox="1098 213 226 226" role="img" aria-labelledby="title desc">
<title id="title">V Pilot approved animated compass</title>
<desc id="desc">Approved V Pilot three-dimensional compass animation used by the Frameworks mega menu.</desc>
<defs>
 <radialGradient id="dial" cx="30%" cy="23%" r="82%"><stop offset="0" stop-color="#fff"/><stop offset=".24" stop-color="#fbfcfc"/><stop offset=".68" stop-color="#e9edf0"/><stop offset="1" stop-color="#ccd4da"/></radialGradient>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6b70"/><stop offset=".45" stop-color="#ff1321"/><stop offset="1" stop-color="#97000a"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f8fbfd"/><stop offset=".5" stop-color="#cbd3d9"/><stop offset="1" stop-color="#758592"/></linearGradient>
 <radialGradient id="pivot" cx="28%" cy="22%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#f0f3f5"/><stop offset=".78" stop-color="#aeb9c2"/><stop offset="1" stop-color="#748593"/></radialGradient>
 <filter id="dialShadow" x="-45%" y="-45%" width="190%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#061a2b" flood-opacity=".3"/></filter>
 <filter id="needleShadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="2" dy="4" stdDeviation="2.6" flood-color="#061a2b" flood-opacity=".45"/></filter>
 <clipPath id="faceClip"><circle cx="1211" cy="326" r="80"/></clipPath>
 <style><![CDATA[
  #heading{transform-origin:1211px 326px;animation:nwne 4.6s cubic-bezier(.42,0,.58,1) infinite;will-change:transform}
  #reflection{animation:shine 5.4s ease-in-out infinite}
  #north-light{animation:pulse 2.4s ease-in-out infinite}
  svg:hover #heading{animation:nwneFast 2.5s cubic-bezier(.42,0,.58,1) infinite}
  @keyframes nwne{0%,100%{transform:rotate(45deg)}50%{transform:rotate(135deg)}}
  @keyframes nwneFast{0%,100%{transform:rotate(45deg)}50%{transform:rotate(135deg)}}
  @keyframes shine{0%,30%,100%{opacity:0;transform:translateX(-95px)}55%{opacity:.7}75%{opacity:0;transform:translateX(105px)}}
  @keyframes pulse{0%,100%{opacity:.38}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){#heading,#reflection,#north-light{animation:none!important}#heading{transform:rotate(90deg)}}
 ]]></style>
</defs>
<!-- Premium compass bezel and face -->
<g filter="url(#dialShadow)"><circle cx="1211" cy="326" r="91" fill="#082f52"/><circle cx="1211" cy="326" r="81" fill="url(#dial)" stroke="#fff" stroke-width="2"/></g>
<!-- restrained compass rose -->
<g opacity=".88">
 <path d="M 1211 259 L 1223 312 L 1211 326 L 1199 312 Z" fill="#bdc7cf"/>
 <path d="M 1278 326 L 1225 338 L 1211 326 L 1225 314 Z" fill="#aeb9c2"/>
 <path d="M 1211 393 L 1199 340 L 1211 326 L 1223 340 Z" fill="#bbc4cb"/>
 <path d="M 1144 326 L 1197 314 L 1211 326 L 1197 338 Z" fill="#d6dce1"/>
</g>
<!-- red heading tip continuously sweeps NW to NE through North -->
<g id="heading" filter="url(#needleShadow)">
 <path d="M 1138 326 L 1206 311 L 1213 326 L 1206 341 Z" fill="url(#red)"/>
 <path d="M 1275 326 L 1215 314 L 1209 326 L 1215 338 Z" fill="url(#silver)"/>
 <path d="M 1145 324 L 1204 314 L 1196 321 Z" fill="#ff9ca1" opacity=".72"/>
</g>
<circle cx="1211" cy="326" r="17" fill="url(#pivot)" stroke="#fff" stroke-width="2" filter="url(#needleShadow)"/><circle cx="1206" cy="321" r="5" fill="#fff" opacity=".92"/>
<g clip-path="url(#faceClip)" opacity=".42"><ellipse id="reflection" cx="1135" cy="284" rx="27" ry="105" fill="#fff" transform="rotate(28 1211 326)"/></g>
</svg>
